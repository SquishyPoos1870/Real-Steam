[mod-setting-description]
real-steam-enable-runtime-effects=Turns all Real Steam runtime vapour effects on or off.
real-steam-density=Controls how often Real Steam emits visual vapour. High gives more visible leaks and machine steam; Low is best for very large factories. Pipe leaks stay selected and controlled so whole pipe runs do not become smoky.
real-steam-include-boilers=Allows boilers, heat exchangers, and supported IR3 copper boilers to emit soft working vapour.
real-steam-include-pipes=Allows steam pipes, pipe-to-ground joins, and supported IR3 steam pipework to emit small leak wisps. Pipe leaks prefer selected bad seals and pipe-to-ground joins instead of making whole pipe runs smoky.
real-steam-weather-integration=When Real Rain or Real Wind is installed, storms and gusts push steam/vapour harder while each mod remains optional and stand-alone.
real-steam-quality-reduces-leaks=When enabled, higher-quality steam equipment produces fewer Real Steam leak visuals. Normal quality keeps the standard look; uncommon, rare, epic, and legendary quality become progressively cleaner.
real-steam-replace-boiler-smoke=Startup option that swaps vanilla boiler exhaust smoke to Real Steam's softer pressure puff.

[string-mod-setting]
real-steam-density-low=Low
real-steam-density-balanced=Balanced
real-steam-density-high=High
